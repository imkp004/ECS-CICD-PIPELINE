<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirtan's Cloud App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: #1e293b;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 15px;
        }

        .subtitle {
            font-size: 22px;
            color: #94a3b8;
            margin-bottom: 35px;
        }

        .status {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 30px;
            background: #166534;
            color: #bbf7d0;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .box {
            background: #334155;
            padding: 20px;
            border-radius: 12px;
        }

        .box h3 {
            margin: 0 0 8px;
            color: #38bdf8;
        }

        .box p {
            margin: 0;
            color: #cbd5e1;
        }

        .footer {
            margin-top: 35px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">☁️</div>

        <h1>Cloud Deployment Successful!</h1>

        <p class="subtitle">
            This application was deployed through AWS ECS Fargate.
        </p>

        <div class="status">
            ● APPLICATION RUNNING
        </div>

        <div class="info">

            <div class="box">
                <h3>Container</h3>
                <p>NGINX</p>
            </div>

            <div class="box">
                <h3>Platform</h3>
                <p>AWS ECS Fargate</p>
            </div>

            <div class="box">
                <h3>Image</h3>
                <p>Amazon ECR</p>
            </div>

            <div class="box">
                <h3>Pipeline</h3>
                <p>GitHub Actions</p>
            </div>

        </div>

        <div class="footer">
            Version 2.0 — New Deployment
        </div>

    </div>

</div>

</body>
</html>
